name: "Validate"
on:
  push: {}
jobs:
  unit:
    name: "Unit"
    runs-on: ubuntu-latest
    steps:
      - name: "retrieve"
        uses: actions/checkout@v3

      - name: "trigger"
        run: |
          chmod +x provision
          ./provision
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

